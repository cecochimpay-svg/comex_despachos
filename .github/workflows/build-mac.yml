name: Compilar instalador Mac

on:
  push:
    branches: [ main ]

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias y reconstruir binarios C++
        run: |
          npm install
          npm run postinstall

      - name: Generar icono Mac valido (512x512)
        run: |
          # Si existe logo.png, lo redimensionamos a 512x512 como icono para Mac
          if [ -f "logo.png" ]; then
            sips -z 512 512 logo.png --out icon_mac.png
          else
            sips -z 512 512 icono.ico --out icon_mac.png
          fi

      - name: Compilar archivo DMG Universal
        run: npx electron-builder --mac dmg --universal -c.mac.icon=icon_mac.png

      - name: Subir binario como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: COMEX-Instalador-Mac
          path: dist/*.dmg